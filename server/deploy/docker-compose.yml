services:
  game:
    build:
      context: ../..
      dockerfile: server/deploy/Dockerfile
    restart: unless-stopped
    command:
      - java
      - -Xms128m
      - -Xmx512m
      - -jar
      - /app/game-server.jar
    environment:
      JIANGHU_HOST: 0.0.0.0
      JIANGHU_PORT: 8765
      JIANGHU_DB: /app/state/jianghu.db
      JIANGHU_SAMPLES: /app/samples
      JIANGHU_DATA: /app/data
    volumes:
      - game-data:/app/state
    expose:
      - "8765"
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    networks:
      - internal

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      - game
    environment:
      DOMAIN: ${DOMAIN:?Hãy đặt DOMAIN trong .env}
      EMAIL: ${EMAIL:?Hãy đặt EMAIL trong .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal

volumes:
  game-data:
  caddy-data:
  caddy-config:

networks:
  internal:
